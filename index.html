<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OAU EEE 282 CBT Lab — Obafemi Awolowo University. Timed tests, study mode, shuffled question banks, auto-saved progress and full worked solutions for Electronic & Electrical Introductory Practicals II." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/oau-favicon-180.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/katex/katex.min.css" />
    <title>OAU · EEE 282 CBT Lab</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#F5F7FC;color:#0E1436;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <div style="width:48px;height:48px;border:4px solid #DCE2F2;border-top-color:#010080;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px"></div>
        <p style="font-size:18px;font-weight:600;margin:0">Obafemi Awolowo University<br/><span style="font-size:14px;color:#5A6488;font-weight:500">EEE 282 CBT Lab</span></p>
        <p id="loading-sub" style="font-size:14px;color:#5A6488;margin-top:6px">Loading your test practice…</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // Inline fallback: if JS is slow, update the message (doesn't depend on the bundle)
      setTimeout(function(){var s=document.getElementById('loading-sub');if(s)s.textContent='Still loading… please wait a moment.';},4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script defer src="/katex/katex.min.js"></script>
    <script defer src="/katex/auto-render.min.js"></script>
  </body>
</html>

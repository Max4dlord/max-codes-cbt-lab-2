# ============================================================================
# OPTIONAL — Vercel Deploy Hook trigger.
#
# You do NOT need this if you connected the repo in the Vercel dashboard
# (Vercel's GitHub integration already deploys on every push automatically).
# It is here for the case where the project was imported WITHOUT the GitHub
# integration and you want pushes to trigger a build.
#
# Setup (one time):
#   1. Vercel → Project → Settings → Git → Deploy Hooks → Create Hook
#      (name: github-push, branch: main)  → copy the URL.
#   2. GitHub → Repo → Settings → Secrets and variables → Actions → New
#      repository secret
#      Name:  VERCEL_DEPLOY_HOOK_URL
#      Value: the hook URL from step 1.
#   3. Push — this workflow then calls the hook on every push to main.
#
# Until the secret exists the job runs and silently does nothing.
# ============================================================================
name: Vercel Deploy Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Ping deploy hook (if configured)
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Skip when no hook is configured
        if: env.HOOK == ''
        run: |
          echo "::warning title=Vercel deploy hook not configured::VERCEL_DEPLOY_HOOK_URL is unset, so this job deploys nothing. If the project is connected to Vercel through the GitHub integration, pushes already deploy automatically and this workflow can be deleted. Otherwise add the secret: Vercel -> Settings -> Git -> Deploy Hooks -> copy the URL, then GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret -> VERCEL_DEPLOY_HOOK_URL."

      - name: Trigger Vercel build
        if: env.HOOK != ''
        run: |
          echo "Triggering Vercel deploy hook…"
          curl -fsS -X POST "$HOOK" -o response.json
          cat response.json

<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="310" y="26" text-anchor="middle">The arrow is always on the emitter, never the collector</text><g transform="translate(40,78) scale(1.6)"><g fill="none" stroke="#010080" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="30" r="24"/><path d="M0,30 H46"/><path d="M46,15 V45"/><path d="M46,24 L74,14"/><path d="M74,14 H100"/><path d="M46,36 L76,46"/><path d="M76,46 H100"/><polygon points="78,46 66,43 70,50" fill="#010080" stroke="none"/></g></g><text class="tb" x="46" y="116" text-anchor="start">B (base)</text><text class="tb" x="206" y="102" text-anchor="start">C</text><text class="tb" x="206" y="156" text-anchor="start">E</text><circle cx="154" cy="152" r="17" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="4 3"/><g transform="translate(340,78) scale(1.6)"><g fill="none" stroke="#010080" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="30" r="24"/><path d="M0,30 H46"/><path d="M46,15 V45"/><path d="M46,24 L74,14"/><path d="M74,14 H100"/><path d="M46,36 L76,46"/><path d="M76,46 H100"/><polygon points="52,41 64,38 60,45" fill="#010080" stroke="none"/></g></g><text class="tb" x="346" y="116" text-anchor="start">B (base)</text><text class="tb" x="506" y="102" text-anchor="start">C</text><text class="tb" x="506" y="156" text-anchor="start">E</text><circle cx="434" cy="144" r="17" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="4 3"/><text x="120" y="208" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#010080">NPN</text><text class="t12" x="120" y="232" text-anchor="middle">arrow points AWAY from the base</text><text x="420" y="208" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#010080">PNP</text><text class="t12" x="420" y="232" text-anchor="middle">arrow points TOWARDS the base</text><rect x="60" y="254" width="500" height="56" rx="10" fill="#f7f9fd" stroke="#C9A227" stroke-width="2"/><text x="310" y="280" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#C9A227">NPN = Not Pointing iN     &#183;     PNP = Pointing iN</text><text class="t12" x="310" y="300" text-anchor="middle">conventional current follows the arrow: out of the emitter on an NPN</text></svg>
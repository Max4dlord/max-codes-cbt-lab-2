>black</text><path d="M510,200 C510,240 470,90 470,150" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/><circle cx="470" cy="150" r="5" fill="#C62828"/><text class="tb" x="480" y="155" text-anchor="start" fill="#C62828">red</text><text class="t13" x="425" y="220" text-anchor="middle">reading: OL</text><text class="t12" x="290" y="250" text-anchor="middle">Two junctions back to back: one is always reverse biased, so no current flows.</text></svg>
<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 345" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="310" y="26" text-anchor="middle">104K vs 104J: same capacitance, different tolerance</text><circle cx="160" cy="112" r="60" fill="#f0dfb0" stroke="#010080" stroke-width="2.5"/><line x1="138" y1="166" x2="138" y2="208" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="182" y1="166" x2="182" y2="208" stroke="#010080" stroke-width="3" stroke-linecap="round"/><text x="160" y="119.33333333333333" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#010080">104K</text><circle cx="440" cy="112" r="60" fill="#f0dfb0" stroke="#010080" stroke-width="2.5"/><line x1="418" y1="166" x2="418" y2="208" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="462" y1="166" x2="462" y2="208" stroke="#010080" stroke-width="3" stroke-linecap="round"/><text x="440" y="119.33333333333333" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#010080">104J</text><text class="tb" x="310" y="100" text-anchor="middle">same value</text><text class="t12" x="310" y="120" text-anchor="middle">only the last</text><text class="t12" x="310" y="138" text-anchor="middle">letter changes</text><text class="t12" x="160" y="232" text-anchor="middle">10 &#215; 10 000 pF = 100 000 pF = 100 nF</text><text x="160" y="262" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#010080">K = &#177;10 %</text><text class="t12" x="440" y="232" text-anchor="middle">10 &#215; 10 000 pF = 100 000 pF = 100 nF</text><text x="440" y="262" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#0B7A55">J = &#177;5 %</text><rect x="60" y="288" width="500" height="44" rx="10" fill="#f7f9fd" stroke="#010080" stroke-width="1.5"/><text class="t12" x="310" y="316" text-anchor="middle">tolerance letters:   J = &#177;5 %   &#183;   K = &#177;10 %   &#183;   M = &#177;20 %</text></svg>
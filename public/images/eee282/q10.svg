<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="300" y="24" text-anchor="middle">RED probe on pin 2 &#8594; 0.65 V to both other pins</text><path d="M180,60 h96 a10,10 0 0 1 10,10 v70 a10,10 0 0 1 -10,10 h-96 a10,10 0 0 1 -10,-10 v-70 a10,10 0 0 1 10,-10 z" fill="#eef1fa" stroke="#010080" stroke-width="2.4"/><line x1="200" y1="130" x2="200" y2="150" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="228" y1="130" x2="228" y2="150" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="256" y1="130" x2="256" y2="150" stroke="#010080" stroke-width="3" stroke-linecap="round"/><text class="tb" x="200" y="166" text-anchor="middle">1</text><circle cx="200" cy="130" r="4" fill="#010080"/><text class="tb" x="228" y="166" text-anchor="middle">2</text><circle cx="228" cy="130" r="4" fill="#010080"/><text class="tb" x="256" y="166" text-anchor="middle">3</text><circle cx="256" cy="130" r="4" fill="#010080"/><rect x="30" y="120" width="150" height="70" rx="6" fill="#ffffff" stroke="#010080" stroke-width="2.2"/><text class="t11" x="105" y="142" text-anchor="middle">DMM &#8212; DIODE MODE</text><text class="t15" x="105" y="178" text-anchor="middle" fill="#010080">0.65 V</text><path d="M140,190 C140,230 200,92 200,152" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/><circle cx="200" cy="152" r="5" fill="#C62828"/><text class="tb" x="190" y="157" text-anchor="end" fill="#C62828">0.65 V</text><path d="M140,190 C140,230 256,92 256,152" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round"/><circle cx="256" cy="152" r="5" fill="#C62828"/><text class="tb" x="266" y="157" text-anchor="start" fill="#C62828">0.65 V</text><line x1="105" y1="190" x2="240" y2="150" stroke="#C62828" stroke-width="3" stroke-linecap="round"/><rect x="430" y="60" width="130" height="120" rx="10" fill="#f7f9fd" stroke="#010080" stroke-width="2"/><text class="tb" x="495" y="90" text-anchor="middle" fill="#010080">NPN</text><text class="t12" x="495" y="112" text-anchor="middle">Base = pin 2</text><text class="t12" x="495" y="136" text-anchor="middle">red = common base</text><text class="t12" x="495" y="154" text-anchor="middle">&#8594; NPN</text><text class="t12" x="300" y="232" text-anchor="middle">Red probe forward-biases both junctions from the same pin,</text><text class="t12" x="300" y="252" text-anchor="middle">so pin 2 is the P-type middle layer &#8212; the base of an NPN.</text></svg>
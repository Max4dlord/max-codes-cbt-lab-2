<text class="tb" x="495" y="90" text-anchor="middle" fill="#010080">PNP</text><text class="t12" x="495" y="112" text-anchor="middle">Base = pin 1</text><text class="t12" x="495" y="136" text-anchor="middle">black = common base</text><text class="t12" x="495" y="154" text-anchor="middle">&#8594; PNP</text><text class="t12" x="300" y="232" text-anchor="middle">Black (COM) on the shared pin means it is the N-type middle layer &#8212; a PNP transistor.</text></svg>
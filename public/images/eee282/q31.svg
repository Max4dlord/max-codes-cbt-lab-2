<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="310" y="26" text-anchor="middle">Resistor shorthand: the letter marks the decimal point</text><line x1="60" y1="110" x2="110" y2="110" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="320" y1="110" x2="370" y2="110" stroke="#010080" stroke-width="3" stroke-linecap="round"/><rect x="110" y="68" width="210" height="84" rx="14" fill="#f2e6c8" stroke="#010080" stroke-width="2.5"/><text x="185" y="124" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#010080">2</text><text x="215" y="124" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#C9A227">K</text><text x="245" y="124" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#010080">7</text><text class="t12" x="215" y="176" text-anchor="middle">the code printed on the body</text><text x="215" y="218" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#010080">2.7 k&#937;  =  2700 &#937;</text><text x="310" y="258" text-anchor="middle" style="font-size:14px;font-weight:400;fill:#5b6478">1R0 = 1.0 &#937;      4K7 = 4.7 k&#937;      1M0 = 1.0 M&#937;</text><rect x="400" y="68" width="200" height="108" rx="10" fill="#f7f9fd" stroke="#C9A227" stroke-width="2"/><text class="tb" x="500" y="92" text-anchor="middle">Letter = multiplier</text><text class="t12" x="500" y="116" text-anchor="middle">R = &#215;1  (ohms)</text><text class="t12" x="500" y="138" text-anchor="middle">K = &#215;1 000</text><text class="t12" x="500" y="160" text-anchor="middle">M = &#215;1 000 000</text></svg>
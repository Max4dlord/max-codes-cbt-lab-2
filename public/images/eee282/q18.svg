<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" width="600" height="244" viewBox="0 0 600 244" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two discrete diodes back to back: no single common pin, so this is not a BJT"><style>
 text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#111a3d}
 .gl{stroke:#c3cad9;stroke-width:1}.ax{stroke:#7d89a8;stroke-width:1.3}
 .ac{fill:none;stroke:#B08A1B;stroke-width:2.2}
 .t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}
 .tb{font-size:13px;font-weight:700}.tg{font-size:13px;font-weight:700;fill:#7a5f0a}
 .l{fill:none;stroke:#010080;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
 .w{fill:none;stroke:#010080;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
 .w2{fill:none;stroke:#a52a2a;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
 .dm{fill:none;stroke:#010080;stroke-width:1.5;stroke-dasharray:5 4}
 .dg{fill:none;stroke:#1e7a45;stroke-width:1.5;stroke-dasharray:6 4}
</style><text class="tb" x="300" y="24" text-anchor="middle">Two separate diodes, no common pin &#8594; NOT a BJT</text><g transform="translate(30,90) scale(0.9)"><g fill="none" stroke="#010080" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0,30 H36"/><polygon points="36,16 36,44 66,30" fill="#010080" stroke="none"/><path d="M66,16 V44"/><path d="M66,30 H100"/></g></g><g transform="translate(200,90) scale(0.9)"><g fill="none" stroke="#010080" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0,30 H36"/><polygon points="36,16 36,44 66,30" fill="#010080" stroke="none"/><path d="M66,16 V44"/><path d="M66,30 H100"/></g></g><line x1="185" y1="118" x2="205" y2="118" stroke="#010080" stroke-width="2.6" stroke-linecap="round"/><text class="t13" x="120" y="190" text-anchor="middle">two diodes back to back</text><rect x="350" y="60" width="230" height="130" rx="10" fill="#f7f9fd" stroke="#010080" stroke-width="1.6"/><text class="tb" x="465" y="86" text-anchor="middle">Probe results</text><text class="t12" x="365" y="112" >red on 1: pin 2 = 0.6 V, pin 3 = OL</text><text class="t12" x="365" y="136" >black on 1: pin 2 = OL, pin 3 = 0.6 V</text><text class="tg" x="365" y="168" >No single pin reaches both.</text><text class="t12" x="300" y="224" text-anchor="middle">A BJT must have ONE pin that conducts to both others with the SAME polarity.</text></svg>
<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="310" y="26" text-anchor="middle">A probe that slips across base and collector</text><path d="M60,70 h96 a10,10 0 0 1 10,10 v70 a10,10 0 0 1 -10,10 h-96 a10,10 0 0 1 -10,-10 v-70 a10,10 0 0 1 10,-10 z" fill="#eef1fa" stroke="#010080" stroke-width="2.4"/><line x1="80" y1="140" x2="80" y2="160" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="140" x2="108" y2="160" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="136" y1="140" x2="136" y2="160" stroke="#010080" stroke-width="3" stroke-linecap="round"/><text class="tb" x="80" y="176" text-anchor="middle">E</text><circle cx="80" cy="140" r="4" fill="#010080"/><text class="tb" x="108" y="176" text-anchor="middle">B</text><circle cx="108" cy="140" r="4" fill="#010080"/><text class="tb" x="136" y="176" text-anchor="middle">C</text><circle cx="136" cy="140" r="4" fill="#010080"/><line x1="250" y1="52" x2="122" y2="150" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><circle cx="122" cy="150" r="5" fill="#1f2937"/><text class="t12" x="258" y="60" text-anchor="start">one probe tip</text><line x1="108" y1="150" x2="136" y2="150" stroke="#C62828" stroke-width="7" stroke-linecap="round"/><circle cx="122" cy="150" r="20" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="5 4"/><text class="tb" x="122" y="198" text-anchor="middle" fill="#C62828">B and C shorted together</text><rect x="330" y="78" width="270" height="148" rx="12" fill="#fdf3f3" stroke="#C62828" stroke-width="2"/><text x="465" y="112" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#C62828">DESTROYED</text><text class="t12" x="465" y="142" text-anchor="middle">With no base resistor in that</text><text class="t12" x="465" y="160" text-anchor="middle">path, nothing limits the current</text><text class="t12" x="465" y="178" text-anchor="middle">and the junctions burn out.</text><text class="tg" x="465" y="206" text-anchor="middle">Test transistors OUT of circuit</text><text class="t12" x="310" y="262" text-anchor="middle">One momentary slip is enough &#8212; the device dies in milliseconds.</text></svg>
<svg class="diagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" preserveAspectRatio="xMidYMid meet" role="img"><text class="tb" x="310" y="26" text-anchor="middle">Ceramic capacitor code: 229</text><circle cx="140" cy="130" r="68" fill="#f0dfb0" stroke="#010080" stroke-width="2.5"/><line x1="118" y1="192" x2="118" y2="234" stroke="#010080" stroke-width="3" stroke-linecap="round"/><line x1="162" y1="192" x2="162" y2="234" stroke="#010080" stroke-width="3" stroke-linecap="round"/><text x="140" y="138.66666666666666" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#010080">229</text><text class="t12" x="140" y="258" text-anchor="middle">ceramic disc</text><rect x="250" y="66" width="350" height="116" rx="10" fill="#f7f9fd" stroke="#C9A227" stroke-width="2"/><text x="425" y="100" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#C9A227">22 &#215; 0.1  =  2.2 pF</text><text class="t12" x="425" y="128" text-anchor="middle">first two digits give the significant figures: 22</text><text class="t12" x="425" y="150" text-anchor="middle">the third digit is the multiplier: 9 &#8594; &#215;0.1</text><text class="tg" x="425" y="172" text-anchor="middle">8 and 9 are the exceptions</text><rect x="40" y="274" width="540" height="56" rx="10" fill="#f7f9fd" stroke="#010080" stroke-width="1.5"/><text class="t12" x="310" y="296" text-anchor="middle">third digit:  0 = &#215;1    1 = &#215;10    2 = &#215;100    3 = &#215;1 000    4 = &#215;10 000</text><text class="tg" x="310" y="318" text-anchor="middle">8 = &#215;0.01    9 = &#215;0.1   &#8592; these two REDUCE the value</text></svg>